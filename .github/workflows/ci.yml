name: public-reproducibility-checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install lightweight dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Run contract demo
        shell: bash
        run: python -m service_loop.run_demo --output /tmp/service-loop-demo.json
      - name: Check public files and secret patterns
        shell: bash
        run: |
          test "$(find results_public -type f -printf '%s\n' | awk '$1 > 1048576 { count++ } END { print count + 0 }')" = "0"
          ! grep -RInE 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9_-]{20,}' --exclude-dir=.git .
